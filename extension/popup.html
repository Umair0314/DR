<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SEO SERP Metrics</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header>
        <div class="brand-mark" aria-hidden="true">DR</div>
        <div>
          <h1>SEO SERP Metrics</h1>
          <p id="version"></p>
        </div>
      </header>
      <p class="description">See Ahrefs Domain Rating beside organic Google results.</p>
      <label class="toggle-row" for="enabled">
        <span>Enable on Google Search</span>
        <input id="enabled" type="checkbox">
      </label>
      <p id="status" role="status" aria-live="polite"></p>
      <section class="redirect-access">
        <p id="redirect-permission-status" role="status" aria-live="polite">
          Redirect checks need optional access to all websites.
        </p>
        <button id="enable-redirect-checks" type="button">Enable Redirect Checks</button>
      </section>
      <footer>
        <a href="https://ahrefs.com/" target="_blank" rel="noreferrer">Domain Rating by Ahrefs</a>
        <button id="settings" type="button">Settings</button>
      </footer>
      <section class="portfolio-cta">
        <div class="divider"></div>
        <p class="cta-title">Want to Rank Higher?</p>
        <p class="cta-services">On-Page • Off-Page • Local SEO • GMB Creation</p>
        <button id="seo-audit" type="button">Get Free SEO Audit →</button>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
